# Netlify config: MoneyQuest is a static site, so there is no build step.
[build]
  publish = "."
  command = ""

# The service worker must never be cached, or phones won't pick up new versions.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Any unknown path loads the app (it uses #/ routes internally).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
